<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4D Tree — a / b / c / d</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --a: #ff6b6b;
    --b: #4ecdc4;
    --c: #ffd93d;
    --d: #a78bfa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif; }
  #stage { position: absolute; inset: 0; cursor: grab; }
  #stage.dragging { cursor: grabbing; }

  #hud {
    position: absolute; top: 14px; left: 14px; z-index: 10;
    background: rgba(22,27,34,.92); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px; width: 265px;
    backdrop-filter: blur(6px); user-select: none;
  }
  #hud h1 { font-size: 15px; margin-bottom: 4px; letter-spacing: .3px; }
  #hud .sub { font-size: 11px; color: var(--muted); margin-bottom: 12px; line-height: 1.5; }

  .group-label { font-size: 11px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 1px; margin: 10px 0 6px; }

  .dim-row { display: flex; align-items: center; gap: 8px; margin: 5px 0; font-size: 13px; }
  .dim-row .swatch { width: 12px; height: 12px; border-radius: 3px; flex: none; }
  .dim-row label { display: flex; align-items: center; gap: 8px; cursor: pointer; flex: 1; }
  .dim-row input { accent-color: currentColor; cursor: pointer; }
  .dim-row.off label { opacity: .45; }

  .rot-row { display: flex; align-items: center; justify-content: space-between;
    margin: 5px 0; font-size: 12.5px; }
  .rot-row .plane { font-family: Consolas, monospace; color: var(--text); }
  .rot-row button {
    background: #21262d; color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 2px 9px; cursor: pointer; font-size: 12px; margin-left: 4px;
  }
  .rot-row button:hover { background: #2d333b; }
  .rot-row .val { width: 52px; text-align: right; font-family: Consolas, monospace;
    color: var(--muted); display: inline-block; }

  #buttons { display: flex; gap: 8px; margin-top: 12px; }
  #buttons button {
    flex: 1; background: #21262d; color: var(--text); border: 1px solid var(--border);
    border-radius: 7px; padding: 6px 0; cursor: pointer; font-size: 12.5px;
  }
  #buttons button:hover { background: #2d333b; }
  #buttons button.active { background: #1f6feb; border-color: #1f6feb; color: #fff; }

  #hint {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: var(--muted); background: rgba(22,27,34,.85);
    padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border);
    pointer-events: none; white-space: nowrap;
  }
  #stats { position: absolute; top: 14px; right: 14px; font-size: 11px; color: var(--muted);
    background: rgba(22,27,34,.85); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; font-family: Consolas, monospace; line-height: 1.6; z-index: 10; }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div id="hud">
  <h1>🌳 4-Dimensional Tree</h1>
  <div class="sub">A tree grown in a 4-D space (a, b, c, d), projected down to your screen.
    Drag to rotate through the 6 rotation planes of 4-space.</div>

  <div class="group-label">Dimensions</div>
  <div class="dim-row" id="dim-a">
    <label><input type="checkbox" checked data-dim="0">
      <span class="swatch" style="background:var(--a)"></span> a axis (red)</label>
  </div>
  <div class="dim-row" id="dim-b">
    <label><input type="checkbox" checked data-dim="1">
      <span class="swatch" style="background:var(--b)"></span> b axis (teal)</label>
  </div>
  <div class="dim-row" id="dim-c">
    <label><input type="checkbox" checked data-dim="2">
      <span class="swatch" style="background:var(--c)"></span> c axis (yellow)</label>
  </div>
  <div class="dim-row" id="dim-d">
    <label><input type="checkbox" checked data-dim="3">
      <span class="swatch" style="background:var(--d)"></span> d axis (purple)</label>
  </div>

  <div class="group-label">4D rotation planes <span style="text-transform:none">(drag = ab)</span></div>
  <div id="rotControls"></div>

  <div id="buttons">
    <button id="btnSpin" title="auto-rotate through all planes">▶ Spin</button>
    <button id="btnReset">Reset view</button>
    <button id="btnNewTree">New tree</button>
  </div>
</div>

<div id="stats"></div>
<div id="hint">drag: rotate a-b plane &nbsp;•&nbsp; shift+drag: c-d plane &nbsp;•&nbsp; wheel: zoom &nbsp;•&nbsp; keys 1-4: toggle a/b/c/d</div>

<script>
"use strict";
/* ============================================================
   4D TREE
   - A tree is grown recursively in 4-space (a,b,c,d).
   - Each branch direction is a unit 4-vector; children spread
     away from the parent's direction with 4D randomness.
   - Rendering: 4D rotate -> drop hidden dims -> perspective
     project 4D->3D (via d) -> 3D yaw/pitch -> project to 2D.
   ============================================================ */

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

/* ---------------- 4D vector helpers ---------------- */
const v4 = (a=0,b=0,c=0,d=0) => [a,b,c,d];
function normalize4(v) {
  const L = Math.hypot(v[0], v[1], v[2], v[3]) || 1;
  return [v[0]/L, v[1]/L, v[2]/L, v[3]/L];
}
function randomUnit4() {
  // Gaussian sampling -> uniform on S^3
  let g = () => {
    let u = 0, v = 0;
    while (u === 0) u = Math.random();
    while (v === 0) v = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  };
  return normalize4([g(), g(), g(), g()]);
}
/* rotate a 4-vector in plane (i,j) by angle t */
function rot4(v, i, j, t) {
  const c = Math.cos(t), s = Math.sin(t);
  const vi = v[i], vj = v[j];
  v[i] = vi * c - vj * s;
  v[j] = vi * s + vj * c;
  return v;
}

/* ---------------- Tree generation ---------------- */
/* A node: pos[4], depth, parent index, thickness, hue mix */
let nodes = [];   // flat array of nodes; node 0 = root
let edges = [];   // [parentIdx, childIdx]

function growTree(seedAngleSpread = 0.85) {
  nodes = [];
  edges = [];

  // Trunk grows mostly along +b (the "up" axis), with a touch of 4D wander
  const MAX_DEPTH = 6;
  const TRUNK_LEN = 1.15;

  function addNode(pos, depth, parent) {
    nodes.push({ pos: pos.slice(), depth, parent });
    return nodes.length - 1;
  }

  function branch(idx, dir, len, depth) {
    if (depth > MAX_DEPTH) return;

    const nChildren = depth === 0 ? 1 : (depth < 3 ? 3 : 2 + (Math.random() < .5 ? 1 : 0));
    for (let k = 0; k < nChildren; k++) {
      // New direction: blend parent dir with a random 4D direction.
      // Spread increases with depth so outer branches explore more of 4-space.
      const spread = seedAngleSpread * (0.55 + depth * 0.22);
      const r = randomUnit4();
      let nd = [
        dir[0] + r[0] * spread,
        dir[1] + r[1] * spread * (depth === 0 ? 0.35 : 1), // keep trunk mostly upward
        dir[2] + r[2] * spread,
        dir[3] + r[3] * spread,
      ];
      if (depth === 0) { nd[1] = Math.abs(nd[1]); } // trunk biases upward
      nd = normalize4(nd);

      const nlen = len * (0.62 + Math.random() * 0.18);
      const p = nodes[idx].pos;
      const childPos = [
        p[0] + nd[0] * nlen,
        p[1] + nd[1] * nlen,
        p[2] + nd[2] * nlen,
        p[3] + nd[3] * nlen,
      ];
      const cidx = addNode(childPos, depth + 1, idx);
      edges.push([idx, cidx]);
      branch(cidx, nd, nlen, depth + 1);
    }
  }

  const root = addNode(v4(0, -1.6, 0, 0), 0, -1);
  branch(root, v4(0, 1, 0, 0), TRUNK_LEN, 0);

  // Center the tree's bounding box on the origin
  let min = [1e9,1e9,1e9,1e9], max = [-1e9,-1e9,-1e9,-1e9];
  for (const n of nodes) for (let i = 0; i < 4; i++) {
    min[i] = Math.min(min[i], n.pos[i]);
    max[i] = Math.max(max[i], n.pos[i]);
  }
  const ctr = [0,1,2,3].map(i => (min[i] + max[i]) / 2);
  for (const n of nodes) for (let i = 0; i < 4; i++) n.pos[i] -= ctr[i];
}

growTree();

/* ---------------- View state ---------------- */
const PLANES = [ [0,1,'a-b'], [0,2,'a-c'], [0,3,'a-d'], [1,2,'b-c'], [1,3,'b-d'], [2,3,'c-d'] ];
let angles = [0, 0, 0, 0, 0, 0];      // rotation angle per plane
let dimOn = [true, true, true, true]; // a, b, c, d visibility
let yaw = 0.4, pitch = -0.15;         // final 3D view
let zoom = 1;
let spinning = false;
let colorByDepth = true;

/* ---------------- Projection ---------------- */
/* 4D -> (drop hidden dims) -> 4D-perspective along d (if d on)
   -> 3D yaw/pitch -> 2D screen */
function project(p4) {
  // apply 4D rotations (order matters but any fixed order is a valid SO(4) path)
  let v = p4.slice();
  for (let k = 0; k < 6; k++) {
    const [i, j] = PLANES[k];
    if (angles[k] !== 0 && dimOn[i] && dimOn[j]) rot4(v, i, j, angles[k]);
  }
  // hide dimensions: zero them out (orthographic drop)
  for (let i = 0; i < 4; i++) if (!dimOn[i]) v[i] = 0;

  // 4D perspective: if d-axis active, use it as a depth cue
  let x = v[0], y = v[1], z = v[2], w = v[3];
  const distW = 3.2;
  const sW = dimOn[3] ? distW / (distW - w) : 1;
  x *= sW; y *= sW; z *= sW;

  // 3D yaw/pitch
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  let X = x * cy - z * sy;
  let Z = x * sy + z * cy;
  let Y = y * cp - Z * sp;
  Z = y * sp + Z * cp;

  // 3D perspective -> screen
  const dist = 5.0;
  const s = (dist / (dist - Z)) * zoom * Math.min(W, H) * 0.22;
  return [W / 2 + X * s, H / 2 - Y * s, Z];
}

/* Depth-based palette per depth level */
function branchColor(depth) {
  const hues = [24, 32, 45, 90, 130, 190, 300]; // brown trunk -> vivid leaves
  const h = hues[Math.min(depth, hues.length - 1)];
  const l = 38 + depth * 4;
  return `hsl(${h}, 70%, ${l}%)`;
}

/* ---------------- Render ---------------- */
const projected = []; // cached per node: [sx, sy, z]
function render() {
  ctx.clearRect(0, 0, W, H);

  // project all nodes
  projected.length = nodes.length;
  for (let i = 0; i < nodes.length; i++) projected[i] = project(nodes[i].pos);

  // sort edges by average depth (painter's algorithm: far first)
  const order = edges.map((e, i) => i);
  order.sort((e1, e2) => {
    const a = edges[e1], b = edges[e2];
    const za = projected[a[0]][2] + projected[a[1]][2];
    const zb = projected[b[0]][2] + projected[b[1]][2];
    return zb - za;
  });

  for (const ei of order) {
    const [p, c] = edges[ei];
    const A = projected[p], B = projected[c];
    const depth = nodes[c].depth;
    const maxD = 7;
    const wLine = Math.max(0.6, (maxD - depth) * 1.9 * zoom);
    // alpha by depth in Z (nearer = brighter)
    const alpha = Math.max(0.25, Math.min(1, 1.15 - (A[2] + B[2]) * 0.12));

    ctx.strokeStyle = branchColor(depth);
    ctx.globalAlpha = alpha;
    ctx.lineWidth = wLine;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(A[0], A[1]);
    ctx.lineTo(B[0], B[1]);
    ctx.stroke();
  }

  // leaves: dots at terminal nodes (deepest)
  ctx.globalAlpha = 1;
  for (let i = 0; i < nodes.length; i++) {
    if (nodes[i].depth < 6) continue;
    const P = projected[i];
    ctx.fillStyle = branchColor(6);
    ctx.beginPath();
    ctx.arc(P[0], P[1], 2.4 * zoom, 0, Math.PI * 2);
    ctx.fill();
  }

  // axis indicators (a,b,c,d unit vectors from origin)
  const axisLen = 1.4;
  const cols = ['#ff6b6b', '#4ecdc4', '#ffd93d', '#a78bfa'];
  const names = ['a', 'b', 'c', 'd'];
  const O = project([0, 0, 0, 0]);
  ctx.font = 'bold 13px Consolas, monospace';
  for (let i = 0; i < 4; i++) {
    if (!dimOn[i]) continue;
    const p = [0, 0, 0, 0]; p[i] = axisLen;
    const P = project(p);
    ctx.globalAlpha = 0.85;
    ctx.strokeStyle = cols[i];
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(O[0], O[1]); ctx.lineTo(P[0], P[1]); ctx.stroke();
    ctx.fillStyle = cols[i];
    ctx.fillText(names[i], P[0] + 6, P[1] - 6);
  }
  ctx.globalAlpha = 1;

  // stats
  const shown = dimOn.map((v, i) => v ? 'abcd'[i] : null).filter(Boolean).join('');
  document.getElementById('stats').innerHTML =
    `nodes: ${nodes.length}<br>branches: ${edges.length}<br>dims shown: ${shown || '(none)'}`;
}

/* ---------------- Interaction ---------------- */
let dragging = false, lastX = 0, lastY = 0, shiftDrag = false;

canvas.addEventListener('pointerdown', e => {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  shiftDrag = e.shiftKey;
  canvas.classList.add('dragging');
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointerup', () => { dragging = false; canvas.classList.remove('dragging'); });
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  if (e.shiftKey) {
    // rotate in c-d plane + fine 3D pitch
    const k = PLANES.findIndex(p => p[0] === 2 && p[1] === 3);
    angles[k] += dx * 0.008;
    pitch += dy * 0.005;
    updateRotLabels();
  } else {
    // primary drag: 4D rotation in a-b plane + a-c plane (and classic 3D orbit feel)
    const kAB = PLANES.findIndex(p => p[0] === 0 && p[1] === 1);
    const kAC = PLANES.findIndex(p => p[0] === 0 && p[1] === 2);
    angles[kAB] += dx * 0.007;
    angles[kAC] += dy * 0.007;
    yaw += dx * 0.003;
    pitch -= dy * 0.002;
    pitch = Math.max(-1.5, Math.min(1.5, pitch));
    updateRotLabels();
  }
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  zoom *= e.deltaY < 0 ? 1.08 : 0.93;
  zoom = Math.max(0.25, Math.min(4, zoom));
}, { passive: false });

/* dimension toggles */
document.querySelectorAll('input[data-dim]').forEach(cb => {
  cb.addEventListener('change', () => {
    dimOn[+cb.dataset.dim] = cb.checked;
    cb.closest('.dim-row').classList.toggle('off', !cb.checked);
  });
});
window.addEventListener('keydown', e => {
  const m = { '1': 0, '2': 1, '3': 2, '4': 3 }[e.key];
  if (m === undefined) return;
  const cb = document.querySelector(`input[data-dim="${m}"]`);
  cb.checked = !cb.checked;
  cb.dispatchEvent(new Event('change'));
});

/* rotation plane controls */
const rotDiv = document.getElementById('rotControls');
PLANES.forEach(([i, j, name], k) => {
  const row = document.createElement('div');
  row.className = 'rot-row';
  row.innerHTML = `<span class="plane">${name}</span>
    <span><span class="val" id="rv${k}">0°</span>
    <button data-k="${k}" data-s="-1">−</button><button data-k="${k}" data-s="1">+</button></span>`;
  rotDiv.appendChild(row);
});
rotDiv.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  angles[+b.dataset.k] += 0.15 * +b.dataset.s;
  updateRotLabels();
});
function updateRotLabels() {
  PLANES.forEach((_, k) => {
    let deg = ((angles[k] * 180 / Math.PI) % 360 + 360) % 360;
    document.getElementById('rv' + k).textContent = deg.toFixed(0) + '°';
  });
}

/* buttons */
document.getElementById('btnReset').onclick = () => {
  angles = [0, 0, 0, 0, 0, 0]; yaw = 0.4; pitch = -0.15; zoom = 1;
  updateRotLabels();
};
document.getElementById('btnNewTree').onclick = () => {
  growTree(0.7 + Math.random() * 0.5);
};
const btnSpin = document.getElementById('btnSpin');
btnSpin.onclick = () => {
  spinning = !spinning;
  btnSpin.textContent = spinning ? '⏸ Spin' : '▶ Spin';
  btnSpin.classList.toggle('active', spinning);
};

/* ---------------- Main loop ---------------- */
let lastT = 0;
function frame(t) {
  const dt = Math.min(0.05, (t - lastT) / 1000); lastT = t;
  if (spinning) {
    // slowly rotate through several 4D planes at different rates
    angles[0] += dt * 0.30; // a-b
    angles[3] += dt * 0.17; // b-c
    angles[5] += dt * 0.11; // c-d
    yaw += dt * 0.15;
    updateRotLabels();
  }
  render();
  requestAnimationFrame(frame);
}
updateRotLabels();
requestAnimationFrame(frame);
</script>
</body>
</html>
